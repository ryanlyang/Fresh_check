      <text x="536" y="594" text-anchor="middle" fill="#f0a202" font-weight="700">22% lower</text>
    </g>
    <g>
      <rect x="624" y="486" width="34" height="34" fill="#8b95a5"/>
      <rect x="662" y="493" width="34" height="27" fill="#2c7fb8"/>
      <text x="660" y="548" text-anchor="middle">muon</text>
      <text x="660" y="594" text-anchor="middle" fill="#f0a202" font-weight="700">20% lower</text>
    </g>
    <g>
      <rect x="748" y="282" width="34" height="238" fill="#8b95a5"/>
      <rect x="786" y="384" width="34" height="136" fill="#2c7fb8"/>
      <text x="784" y="548" text-anchor="middle">charged</text><text x="784" y="565" text-anchor="middle">frac</text>
      <text x="784" y="594" text-anchor="middle" fill="#2ca25f" font-weight="700">43% lower</text>
    </g>
    <g>
      <rect x="872" y="296" width="34" height="224" fill="#8b95a5"/>
      <rect x="910" y="391" width="34" height="129" fill="#2c7fb8"/>
      <text x="908" y="548" text-anchor="middle">neutral</text><text x="908" y="565" text-anchor="middle">frac</text>
      <text x="908" y="594" text-anchor="middle" fill="#2ca25f" font-weight="700">42% lower</text>
    </g>
    <g>
      <rect x="996" y="129" width="34" height="391" fill="#8b95a5"/>
      <rect x="1034" y="279" width="34" height="241" fill="#2c7fb8"/>
      <text x="1032" y="548" text-anchor="middle">PID</text><text x="1032" y="565" text-anchor="middle">entropy</text>
      <text x="1032" y="594" text-anchor="middle" fill="#2ca25f" font-weight="700">38% lower</text>
    </g>
  </g>

  <text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#344054">Expected pattern: biggest recovery on high-impact composition fractions, smaller gains on rare lepton fractions.</text>
  <text x="600" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#344054">For tagging, this would be useful if the predicted offline-like composition is fed as jet-level context or auxiliary fields to ParT.</text>
</svg>
