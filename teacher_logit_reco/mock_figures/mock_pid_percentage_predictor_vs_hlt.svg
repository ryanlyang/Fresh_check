<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2933">Particle-ID Percentage Predictor: Mock Expected Recovery vs Base HLT</text>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#667085">Synthetic illustration only - not measured data</text>

  <line x1="95" y1="520" x2="1140" y2="520" stroke="#222" stroke-width="1"/>
  <line x1="95" y1="130" x2="95" y2="520" stroke="#222" stroke-width="1"/>
  <text x="34" y="325" transform="rotate(-90 34 325)" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#222">Mean absolute error in fraction</text>

  <g font-family="Arial, sans-serif" font-size="12" fill="#667085">
