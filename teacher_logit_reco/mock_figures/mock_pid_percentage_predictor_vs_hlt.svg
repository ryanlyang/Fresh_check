    <line x1="95" y1="452" x2="1140" y2="452" stroke="#e4e7ec"/>
    <text x="84" y="456" text-anchor="end">0.02</text>
    <line x1="95" y1="384" x2="1140" y2="384" stroke="#e4e7ec"/>
    <text x="84" y="388" text-anchor="end">0.04</text>
    <line x1="95" y1="316" x2="1140" y2="316" stroke="#e4e7ec"/>
    <text x="84" y="320" text-anchor="end">0.06</text>
    <line x1="95" y1="248" x2="1140" y2="248" stroke="#e4e7ec"/>
    <text x="84" y="252" text-anchor="end">0.08</text>
    <line x1="95" y1="180" x2="1140" y2="180" stroke="#e4e7ec"/>
    <text x="84" y="184" text-anchor="end">0.10</text>
    <line x1="95" y1="112" x2="1140" y2="112" stroke="#e4e7ec"/>
    <text x="84" y="116" text-anchor="end">0.12</text>
  </g>

  <rect x="790" y="100" width="22" height="14" fill="#8b95a5"/>
  <text x="820" y="112" font-family="Arial, sans-serif" font-size="14" fill="#222">Base HLT composition estimate</text>
  <rect x="790" y="124" width="22" height="14" fill="#2c7fb8"/>
  <text x="820" y="136" font-family="Arial, sans-serif" font-size="14" fill="#222">HLT to offline PID-% predictor</text>

  <!-- Scale: y = 520 - value * 3400, max shown ~0.12 -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#222">
    <g>
      <rect x="128" y="231" width="34" height="289" fill="#8b95a5"/>
      <rect x="166" y="367" width="34" height="153" fill="#2c7fb8"/>
      <text x="164" y="548" text-anchor="middle">charged</text><text x="164" y="565" text-anchor="middle">hadron</text>
      <text x="164" y="594" text-anchor="middle" fill="#2ca25f" font-weight="700">47% lower</text>
    </g>
    <g>
      <rect x="252" y="275" width="34" height="245" fill="#8b95a5"/>
      <rect x="290" y="374" width="34" height="146" fill="#2c7fb8"/>
      <text x="288" y="548" text-anchor="middle">neutral</text><text x="288" y="565" text-anchor="middle">hadron</text>
      <text x="288" y="594" text-anchor="middle" fill="#2ca25f" font-weight="700">40% lower</text>
    </g>
    <g>
      <rect x="376" y="289" width="34" height="231" fill="#8b95a5"/>
      <rect x="414" y="388" width="34" height="132" fill="#2c7fb8"/>
