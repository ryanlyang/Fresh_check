      <text x="412" y="594" text-anchor="middle" fill="#2ca25f" font-weight="700">43% lower</text>
    </g>
    <g>
      <rect x="500" y="459" width="34" height="61" fill="#8b95a5"/>
      <rect x="538" y="472" width="34" height="48" fill="#2c7fb8"/>
