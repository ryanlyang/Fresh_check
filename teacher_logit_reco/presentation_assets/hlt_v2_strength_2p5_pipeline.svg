<text x="80.0" y="426.0" text-anchor="start" class="callout-text">Strength convention</text>
<text x="80.0" y="456.0" text-anchor="start" class="callout-small">0.0 = exact offline identity</text>
<text x="80.0" y="481.0" text-anchor="start" class="callout-small">1.0 = mild realistic target point</text>
<text x="80.0" y="506.0" text-anchor="start" class="callout-small">2.5 = amplified stress-test degradation</text>
<text x="525.0" y="407.0" text-anchor="start" class="section-label">EFFECTIVE PARAMETERS AT STRENGTH 2.5</text>
