<text x="900.0" y="564.0" text-anchor="start" class="table-val">0.9975</text>
<rect x="526" y="573.0" width="738" height="26" fill="#f4f7fa" />
<text x="548.0" y="590.0" text-anchor="start" class="table-key">Endcap plateau</text>
<text x="900.0" y="590.0" text-anchor="start" class="table-val">0.99</text>
<text x="548.0" y="616.0" text-anchor="start" class="table-key">Barrel pT50 / width</text>
<text x="900.0" y="616.0" text-anchor="start" class="table-val">0.5 / 0.15</text>
<rect x="526" y="625.0" width="738" height="26" fill="#f4f7fa" />
