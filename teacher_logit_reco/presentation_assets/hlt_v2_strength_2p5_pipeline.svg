<text x="900.0" y="668.0" text-anchor="start" class="table-val">0.0375</text>
<rect x="526" y="677.0" width="738" height="26" fill="#f4f7fa" />
<text x="548.0" y="694.0" text-anchor="start" class="table-key">Smear scale</text>
<text x="900.0" y="694.0" text-anchor="start" class="table-val">0.5</text>
<text x="548.0" y="720.0" text-anchor="start" class="table-key">Reassignment scale</text>
<text x="900.0" y="720.0" text-anchor="start" class="table-val">0.375</text>
<text x="55.0" y="580.0" text-anchor="start" class="section-label">Slide phrasing</text>
<text x="55.0" y="612.0" text-anchor="start" class="note">We do not change the label or the underlying physics event.</text>
<text x="55.0" y="638.0" text-anchor="start" class="note">We only create a second detector-resolution view paired one-to-one with the offline jet.</text>
<text x="55.0" y="664.0" text-anchor="start" class="note">At training time, offline and pseudo-HLT can both be used; at inference time, only pseudo-HLT is available.</text>
<text x="55.0" y="707.0" text-anchor="start" class="note">Best short name: fixed_hlt_v2_realistic, strength=2.5</text>
<text x="55.0" y="733.0" text-anchor="start" class="note">Use this as a stress test, not as a claim about an exact CMS/ATLAS HLT response.</text>
