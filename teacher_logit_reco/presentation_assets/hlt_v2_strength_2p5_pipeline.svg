<text x="607.5" y="216.0" text-anchor="middle" class="step-title">2. Merge</text>
<text x="541.0" y="243.0" text-anchor="start" class="step-line">nearby particles</text>
<text x="541.0" y="263.0" text-anchor="start" class="step-line">DeltaR &lt; 0.00625</text>
<text x="541.0" y="283.0" text-anchor="start" class="step-line">prob = 0.625</text>
<line x1="690.0" y1="250.0" x2="700.0" y2="250.0" class="arrow" marker-end="url(#arrow)" />
